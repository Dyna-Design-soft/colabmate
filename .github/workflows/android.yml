name: Android APK

on:
  push:
    branches: [main, dev, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publish GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Release signing key (stable SHA-1 for the Android OAuth client).
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK is signed with a throwaway debug key, so Google sign-in will fail."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # OAuth "Web application" client ID (Android serverClientId).
      - name: Write OAuth config
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_SERVER_CLIENT_ID secret not set - sign-in will show a configuration error."
          fi
          mkdir -p config
          jq -n --arg id "$GOOGLE_SERVER_CLIENT_ID" \
            '{GOOGLE_SERVER_CLIENT_ID: $id}' > config/oauth.json

      # build-number = run number, so every APK installs over the previous one.
      - name: Build release APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=config/oauth.json

      # A fixed file name, so this link always downloads the newest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/colabmate.apk
      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/colabmate.apk
          echo "name=colabmate.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publish the plain .apk (not zipped) on the Releases page.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: ColabMate v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/app/outputs/flutter-apk/${{ steps.apk.outputs.name }}
          body: |
            **Download the APK:** https://github.com/${{ github.repository }}/releases/latest/download/colabmate.apk

            (Ignore the "Source code" files — GitHub adds those to every release automatically.)

            Branch: `${{ github.ref_name }}` · Commit: ${{ github.sha }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties config/oauth.json
